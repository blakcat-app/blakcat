name: 💡 功能建议 / Feature request
description: 建议一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        想讨论而不是正式提案？欢迎先到 [Discussions](../../discussions)。
        Want to discuss rather than formally propose? Start in [Discussions](../../discussions).

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem does this solve
      description: 请描述你遇到的实际场景，而不是直接描述方案 / Describe the situation, not just the solution
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的做法 / Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案 / Alternatives considered

  - type: dropdown
    id: platform
    attributes:
      label: 相关平台 / Affected platforms
      multiple: true
      options:
        - iOS
        - Android
        - Windows
        - macOS
        - 全部 / All
